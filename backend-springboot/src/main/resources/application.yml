server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: craftconnect-backend
  profiles:
    active: dev
  
  # Default development profile uses H2 for instant 0-dependency running
  datasource:
    url: jdbc:h2:mem:craftconnect_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
      
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

craftconnect:
  ai-service:
    url: http://localhost:8000

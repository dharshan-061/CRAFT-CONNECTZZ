# MySQL Production / Staging Profile (Run with: --spring.profiles.active=mysql)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/craftconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
